[package]
name = "asm-view"
version = "0.1.0"
edition = "2024"

[dependencies]
addr2line = { version = "0.27.1", default-features = false, features = ["std"] }
capstone = "0.14.0"
clap = { version = "4.6.7", features = ["derive"] }
cpp_demangle = "0.5.1"
gimli = { version = "0.34.0", default-features = false, features = ["std", "read", "endian-reader"] }
object = "0.41.0"
rustc-demangle = "0.1.28"
